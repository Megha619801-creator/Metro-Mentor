<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MetroMentor AI – Cute Edition 🧸💗</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Custom cute CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body class="cute-bg">

    <div class="container mt-5">
        <div class="cute-card shadow-lg p-4 rounded-4">

            <div class="text-center mb-4">
                <img src="https://cdn-icons-png.flaticon.com/512/826/826902.png"
                     width="80" class="teddy" alt="teddy-bear" />
                <h1 class="cute-title">MetroMentor AI 🧸💗</h1>
                <p class="cute-subtitle">Your sweet little guide to Metropolia 💞</p>
            </div>

            <textarea id="question" class="form-control cute-input" rows="3"
                placeholder="Ask me anything about Metropolia … 💗"></textarea>

            <button class="btn btn-cute w-100 mt-3" onclick="askAI()">
                ✨ Ask MetroMentor AI ✨
            </button>

            <div id="answer" class="cute-answer mt-4 p-3"></div>
        </div>
    </div>

    <script>
        async function askAI() {
            const q = document.getElementById("question").value.trim();
            if (!q) return;

            document.getElementById("answer").innerHTML =
                "<div class='loading'>🧸 Thinking with love… wait a sec… 💘</div>";

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: q })
                });

                if (!res.ok) {
                    document.getElementById("answer").innerHTML =
                        `<div class="cute-bubble">Server error: ${res.status} ${res.statusText}</div>`;
                    return;
                }

                const data = await res.json();

                if (data.error) {
                    document.getElementById("answer").innerHTML =
                        `<div class="cute-bubble">Error: ${data.error}</div>`;
                } else {
                    document.getElementById("answer").innerHTML =
                        `<div class="cute-bubble">${data.answer}</div>`;
                    // clear the input after showing the answer
                    document.getElementById("question").value = "";
                }
            } catch (err) {
                document.getElementById("answer").innerHTML =
                    `<div class="cute-bubble">Network error: ${err.message}</div>`;
            }
        }
    </script>

</body>
</html>
